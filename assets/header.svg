<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <path id="orbit-1" d="M 750 99 A 25 25 0 1 1 700 99 A 25 25 0 1 1 750 99" fill="none"/>
    <path id="orbit-2" d="M 767 99 A 42 42 0 1 1 683 99 A 42 42 0 1 1 767 99" fill="none"/>
    <path id="orbit-3" d="M 783 99 A 58 58 0 1 1 667 99 A 58 58 0 1 1 783 99" fill="none"/>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="199" fill="none" stroke="#21262d" stroke-width="1"/>

  <line x1="24" y1="30" x2="856" y2="30" stroke="#21262d" stroke-width="1"/>
  <line x1="24" y1="168" x2="856" y2="168" stroke="#21262d" stroke-width="1"/>
  <line x1="535" y1="30" x2="535" y2="168" stroke="#21262d" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Identity Block -->
  <text x="24" y="84" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#e6edf3">Denys Chernov</text>
  <text x="25" y="114" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="#a371f7">CURIOUS BY DEFAULT</text>
  <text x="25" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8590">following whatever tangent looks interesting today<tspan fill="#a371f7">_</tspan></text>
  <rect x="300" y="135" width="7" height="11" fill="#a371f7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Orbit guides -->
  <path d="M 750 99 A 25 25 0 1 1 700 99 A 25 25 0 1 1 750 99" fill="none" stroke="#21262d" stroke-width="1"/>
  <path d="M 767 99 A 42 42 0 1 1 683 99 A 42 42 0 1 1 767 99" fill="none" stroke="#21262d" stroke-width="1"/>
  <path d="M 783 99 A 58 58 0 1 1 667 99 A 58 58 0 1 1 783 99" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Center -->
  <circle cx="725" cy="99" r="6" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <circle cx="725" cy="99" r="12" fill="none" stroke="#a371f7" stroke-width="1">
    <animate attributeName="r" values="10;22;10" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting dots -->
  <circle r="3.4" fill="#39d2c0">
    <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#orbit-1"/></animateMotion>
  </circle>
  <circle r="3" fill="#a371f7">
    <animateMotion dur="7s" repeatCount="indefinite" begin="-1.5s"><mpath href="#orbit-2"/></animateMotion>
  </circle>
  <circle r="2.6" fill="#e3b341">
    <animateMotion dur="10s" repeatCount="indefinite" begin="-3s"><mpath href="#orbit-3"/></animateMotion>
  </circle>

  <!-- Twinkling stars -->
  <circle cx="560" cy="48" r="1.4" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" repeatCount="indefinite" begin="0s"/></circle>
  <circle cx="605" cy="140" r="1.1" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" repeatCount="indefinite" begin="0.6s"/></circle>
  <circle cx="645" cy="55" r="1.3" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" repeatCount="indefinite" begin="1.1s"/></circle>
  <circle cx="820" cy="60" r="1.2" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.9s" repeatCount="indefinite" begin="1.7s"/></circle>
  <circle cx="835" cy="130" r="1.4" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="575" cy="110" r="1" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.4s" repeatCount="indefinite" begin="2.1s"/></circle>
  <circle cx="800" cy="145" r="1.1" fill="#e6edf3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite" begin="0.9s"/></circle>

  <text x="856" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" text-anchor="end">say hi ✦</text>
</svg>
